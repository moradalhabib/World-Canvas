<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>God Simulator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --glass: rgba(10, 10, 15, 0.72);
        --glass-edge: rgba(255, 220, 160, 0.18);
        --gold: #d4af6a;
        --gold-soft: #b08e4f;
        --text: #e8e2d2;
        --text-dim: #9a907c;
        --danger: #c25a4a;
        --good: #6fa15a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #07060a; overflow: hidden; }
      body { font-family: "Inter", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
      #game { display: block; width: 100vw; height: 100vh; cursor: grab; }
      #game.targeting { cursor: crosshair; }
      #game:active { cursor: grabbing; }

      /* ---------- LOADING SCREEN ---------- */
      #loading {
        position: fixed; inset: 0; background: #07060a;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 1000; transition: opacity 0.6s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
      #loading h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 56px; font-weight: 600; color: var(--gold);
        letter-spacing: 0.08em; margin: 0 0 8px;
        text-shadow: 0 0 40px rgba(212, 175, 106, 0.3);
      }
      #loading p { color: var(--text-dim); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 32px; }
      #loading-bar {
        width: 280px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden;
      }
      #loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-soft), var(--gold)); transition: width 0.2s; }

      /* ---------- HUD COMMON ---------- */
      .panel {
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid var(--glass-edge);
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 220, 160, 0.08);
        color: var(--text);
        user-select: none;
      }

      /* ---------- RESOURCE BAR ---------- */
      #resource-bar {
        position: fixed; top: 18px; left: 18px;
        display: flex; align-items: center; gap: 0;
        padding: 10px 6px; font-size: 14px; font-weight: 600;
      }
      #resource-bar .res {
        display: flex; align-items: center; gap: 8px; padding: 4px 14px;
        border-right: 1px solid rgba(255, 220, 160, 0.12);
      }
      #resource-bar .res:last-child { border-right: none; }
      #resource-bar .res .icon { font-size: 16px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
      #resource-bar .res.flash { animation: pulseGold 0.6s ease; }
      @keyframes pulseGold { 0% { color: var(--gold); transform: scale(1.1); } 100% { color: var(--text); transform: scale(1); } }

      /* ---------- WORLD CLOCK ---------- */
      #clock {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        padding: 10px 22px; font-family: "Cormorant Garamond", serif; font-size: 18px;
        letter-spacing: 0.06em; display: flex; align-items: center; gap: 10px;
      }
      #clock .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: livePulse 2s ease-in-out infinite; }
      @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
      #clock .season-tag { color: var(--gold); font-weight: 600; }
      #clock .weather-tag { color: var(--text-dim); font-size: 13px; padding-left: 12px; border-left: 1px solid rgba(255,220,160,0.15); margin-left: 4px; }

      /* ---------- TIME CONTROLS ---------- */
      #time-controls {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
      }
      .tc-btn {
        background: transparent; border: 1px solid transparent; color: var(--text-dim);
        font-size: 16px; font-weight: 600; padding: 8px 16px; min-width: 48px;
        border-radius: 9px; cursor: pointer; transition: all 0.15s ease;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .tc-btn:hover { background: rgba(255, 220, 160, 0.06); color: var(--text); }
      .tc-btn.active {
        background: rgba(212, 175, 106, 0.14); color: var(--gold);
        border-color: rgba(212, 175, 106, 0.35);
        box-shadow: 0 0 18px rgba(212, 175, 106, 0.25);
      }

      /* ---------- GOD POWERS ---------- */
      #powers {
        position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 8px; padding: 10px;
      }
      .power-btn {
        background: rgba(20, 18, 26, 0.6); border: 1px solid rgba(255, 220, 160, 0.1);
        color: var(--text); width: 76px; padding: 10px 6px;
        border-radius: 11px; cursor: pointer; transition: all 0.15s ease;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      }
      .power-btn .pi { font-size: 22px; }
      .power-btn .pc { color: var(--gold); font-size: 10px; font-weight: 700; }
      .power-btn:hover:not(.disabled) { border-color: var(--gold); transform: translateX(-2px); box-shadow: -4px 0 16px rgba(212,175,106,0.18); }
      .power-btn.active { background: rgba(212, 175, 106, 0.22); border-color: var(--gold); box-shadow: 0 0 24px rgba(212,175,106,0.35); }
      .power-btn.disabled { opacity: 0.4; cursor: not-allowed; }
      .power-btn.punish .pc { color: var(--danger); }

      /* ---------- NOTIFICATIONS ---------- */
      #notifications {
        position: fixed; bottom: 22px; left: 18px; max-width: 320px;
        display: flex; flex-direction: column-reverse; gap: 6px;
        pointer-events: none;
      }
      .notif {
        padding: 10px 14px; font-size: 13px; line-height: 1.4;
        border-left: 3px solid var(--gold);
        animation: slideIn 0.4s ease, fadeOut 0.6s ease 7.4s forwards;
      }
      .notif.danger { border-left-color: var(--danger); }
      .notif.good { border-left-color: var(--good); }
      .notif.divine { border-left-color: var(--gold); background: rgba(212,175,106,0.08); }
      @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes fadeOut { to { opacity: 0; transform: translateX(-30px); } }

      /* ---------- INSPECT CARD ---------- */
      #inspect {
        position: fixed; padding: 16px 18px; min-width: 260px; max-width: 320px;
        font-size: 13px; pointer-events: auto; z-index: 50;
        opacity: 0; transition: opacity 0.18s ease; transform: translateY(4px);
      }
      #inspect.show { opacity: 1; transform: translateY(0); }
      #inspect h3 { font-family: "Cormorant Garamond", serif; font-size: 22px; margin: 0 0 2px; color: var(--gold); font-weight: 600; }
      #inspect .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; letter-spacing: 0.04em; }
      #inspect .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,220,160,0.06); }
      #inspect .row:last-child { border-bottom: none; }
      #inspect .row .lbl { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      #inspect .row .val { font-weight: 600; }
      #inspect .bar { width: 90px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
      #inspect .bar-fill { height: 100%; background: var(--good); transition: width 0.3s; }
      #inspect .bar-fill.warn { background: #d4a64a; }
      #inspect .bar-fill.danger { background: var(--danger); }
      #inspect .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--text-dim); font-size: 18px; }
      #inspect .close:hover { color: var(--text); }

      /* ---------- EXTINCTION OVERLAY ---------- */
      #extinction {
        position: fixed; inset: 0; background: rgba(7, 4, 8, 0.92);
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 500; backdrop-filter: blur(8px);
      }
      #extinction.show { display: flex; animation: extFade 1.2s ease; }
      @keyframes extFade { from { opacity: 0; } to { opacity: 1; } }
      #extinction h1 { font-family: "Cormorant Garamond", serif; font-size: 88px; color: var(--danger); margin: 0; letter-spacing: 0.1em; text-shadow: 0 0 60px rgba(194,90,74,0.5); }
      #extinction p { color: var(--text-dim); font-size: 16px; margin: 12px 0 32px; letter-spacing: 0.1em; }
      #extinction button { background: rgba(212,175,106,0.12); border: 1px solid var(--gold); color: var(--gold); padding: 14px 36px; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
      #extinction button:hover { background: var(--gold); color: #0c0a0d; }

      /* ---------- TOOLTIP ---------- */
      .tip {
        position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.92); color: var(--text); padding: 6px 10px;
        border-radius: 6px; font-size: 11px; white-space: nowrap; pointer-events: none;
        opacity: 0; transition: opacity 0.15s; border: 1px solid rgba(255,220,160,0.15);
      }
      .power-btn:hover .tip, .tc-btn:hover .tip { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>God Simulator</h1>
      <p>Awakening the world…</p>
      <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <canvas id="game"></canvas>

    <!-- Top-Left: Resource Bar -->
    <div id="resource-bar" class="panel">
      <div class="res" data-r="food"><span class="icon">🌾</span><span class="num">0</span></div>
      <div class="res" data-r="wood"><span class="icon">🪵</span><span class="num">0</span></div>
      <div class="res" data-r="stone"><span class="icon">🪨</span><span class="num">0</span></div>
      <div class="res" data-r="gold"><span class="icon">💰</span><span class="num">0</span></div>
      <div class="res" data-r="faith"><span class="icon">✨</span><span class="num">0</span></div>
    </div>

    <!-- Top-Center: World Clock -->
    <div id="clock" class="panel">
      <span class="dot"></span>
      <span>Day <span id="ck-day">1</span></span>
      <span class="season-tag" id="ck-season">Spring</span>
      <span>Year <span id="ck-year">1</span></span>
      <span class="weather-tag" id="ck-weather">Clear</span>
    </div>

    <!-- Bottom-Center: Time Controls -->
    <div id="time-controls" class="panel">
      <button class="tc-btn" data-cmd="pause" title="Pause">⏸</button>
      <button class="tc-btn active" data-cmd="play" title="Play">▶</button>
      <button class="tc-btn" data-cmd="x5" title="x5 speed">⏩<span style="font-size:10px;opacity:0.7;">5</span></button>
      <button class="tc-btn" data-cmd="x20" title="x20 speed">⏭<span style="font-size:10px;opacity:0.7;">20</span></button>
      <button class="tc-btn" data-cmd="sleep" title="Skip to next season">🌙</button>
    </div>

    <!-- Right: God Powers -->
    <div id="powers" class="panel">
      <button class="power-btn" data-power="bless"><span class="pi">☀️</span><span>Bless</span><span class="pc">50 ✨</span></button>
      <button class="power-btn" data-power="strike"><span class="pi">⚡</span><span>Strike</span><span class="pc">15 ✨</span></button>
      <button class="power-btn" data-power="rain"><span class="pi">🌧️</span><span>Rain</span><span class="pc">20 ✨</span></button>
      <button class="power-btn" data-power="grow"><span class="pi">🌿</span><span>Grow</span><span class="pc">10 ✨</span></button>
      <button class="power-btn" data-power="birth"><span class="pi">👶</span><span>Birth</span><span class="pc">80 ✨</span></button>
      <button class="power-btn punish" data-power="plague"><span class="pi">💀</span><span>Plague</span><span class="pc">PUNISH</span></button>
    </div>

    <!-- Notifications -->
    <div id="notifications"></div>

    <!-- Inspect card -->
    <div id="inspect" class="panel"></div>

    <!-- Extinction Overlay -->
    <div id="extinction">
      <h1>EXTINCTION</h1>
      <p>The world stands silent. Your people are no more.</p>
      <button id="extinction-restart">Bless a New Beginning</button>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
