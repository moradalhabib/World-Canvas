kind = "web"
previewPath = "/"
title = "God Simulator"
version = "1.0.0"
id = "artifacts/god-sim"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25244

[services.development]
run = "pnpm --filter @workspace/god-sim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/god-sim", "run", "build" ]
publicDir = "artifacts/god-sim/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25244"
BASE_PATH = "/"
